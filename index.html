<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת גריטה</title>
<meta name="theme-color" content="#E4002B">
<meta name="description" content="איסוף ציוד לגריטה: סריקה, קטלוג דגמים וייצוא לאקסל">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גריטה">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js?v=4"></script>
<script src="firebase-adapter.js?v=4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly field helper, big, calm and obvious; every question asked one at a time.
   IDEA: a disposal tag clipped to a clipboard: white sticker cards on a soft sheet under a red header.
   PICTURE: the working form itself: big icon tiles, question cards that tick green when done, a progress bar.
   COLOUR and TYPE: signal red #E4002B header field, white cards, sunny yellow #FFC93C accent, ink #17171C; Rubik throughout.
   LAYOUT: header band, then form | list side by side above 900px; on phones one view at a time with a bottom tab bar. */
:root{color-scheme:light dark;
 --bg:light-dark(#F4F4F6,#0F0F12);--card:light-dark(#FFFFFF,#1B1B20);--ink:light-dark(#17171C,#F3F3F5);--mute:light-dark(#62626B,#A3A3AD);
 --line:light-dark(#E3E3E8,#2C2C34);--soft:light-dark(#F6F6F8,#24242B);--red:#E4002B;--redd:light-dark(#C20024,#FF5A72);
 --yel:#FFC93C;--yels:light-dark(#FFF3CC,#3A3115);--ok:light-dark(#0E8A4A,#4CD38A);--oks:light-dark(#E2F6EB,#163222);
 --shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px rgba(20,20,30,.06);--r:18px;--f:"Rubik","Heebo",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
[data-ico]{display:inline-grid;place-items:center}
[data-ico] svg{width:100%;height:100%}

/* ---------- header ---------- */
.top{background:var(--red);color:#fff;padding:18px max(4vw,16px) 22px;border-radius:0 0 28px 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;flex:none;background:rgba(255,255,255,.16);border-radius:16px;display:grid;place-items:center}
.logo svg{width:40px;height:40px}
h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
.kick{margin:4px 0 0;font-size:15px;opacity:.9}
.datecard{flex:none;display:flex;align-items:center;gap:10px;background:#fff;color:#17171C;border-radius:16px;padding:8px 14px 8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.datecard b{font-size:34px;line-height:1;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.datecard span{display:grid;line-height:1.25}
.datecard em{font-style:normal;font-weight:700;font-size:15px}
.datecard i{font-style:normal;font-size:13px;color:#62626B}
.who{display:flex;align-items:center;gap:10px;margin-top:14px}
.who[hidden]{display:none}
.who img{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none}
.who b{display:block;font-size:16px;line-height:1.2}
.who span{display:block;font-size:13px;opacity:.85;direction:ltr;unicode-bidi:isolate;text-align:right;overflow-wrap:anywhere}
.sitecard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.pill{display:grid;background:#fff;border-radius:14px;padding:6px 14px 4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill span{font-size:13px;color:#62626B;font-weight:500}
.pill input{border:0;background:transparent;font-size:18px;font-weight:700;color:#17171C;padding:2px 0 6px;min-height:38px;width:100%}
.pill input:focus{outline:none}
.pill:focus-within{box-shadow:0 0 0 3px var(--yel)}
.pill input:disabled{opacity:.6}
.hbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.ws{display:inline-grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.18);border-radius:14px;padding:4px;gap:4px}
.ws[hidden]{display:none}
.ws button{min-height:44px;padding:0 18px;border:0;border-radius:11px;background:transparent;color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.ws .on{background:#fff;color:var(--red)}
.acctbtns{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){.top .hbar{flex-wrap:wrap}.top .ws{width:100%}.top .ws button{padding:0 8px}.acctbtns{width:100%}.acctbtns .btn{flex:1 1 auto}#mobile{flex:0 0 auto}}
.acctbtns [hidden]{display:none}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55)}

/* ---------- layout ---------- */
.wrap{display:grid;gap:22px;padding:20px max(4vw,16px) 40px;max-width:1320px;margin:0 auto}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,540px) minmax(0,1fr);align-items:start}.list{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain}}

/* ---------- step cards ---------- */
.sec{background:var(--card);border-radius:var(--r);padding:16px 16px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .2s}
.sec.done{border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.si{width:42px;height:42px;flex:none;border-radius:13px;background:var(--yels);color:var(--ink);padding:9px}
.sec.done .si{background:var(--oks);color:var(--ok)}
.sh h2{flex:1;margin:0;font-size:20px;font-weight:700;line-height:1.25}
.sh h2 small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:1px}
.okc{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .2s}
.okc svg{width:18px;height:18px}
.sec.done .okc{background:var(--ok);border-color:var(--ok);color:#fff}

.hwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-weight:600;font-size:16px;min-height:46px;padding:8px 16px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:6px;position:relative}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.hw{flex-direction:column;justify-content:center;border-radius:16px;padding:14px 6px 12px;font-size:15px;gap:8px;text-align:center;line-height:1.2;min-height:98px;background:var(--soft);border-color:transparent}
.chip.hw svg{width:34px;height:34px}
.chip.hw.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--red) 35%,transparent)}
.chip.add{border-style:dashed;border-color:var(--line);color:var(--mute);background:transparent}
.chip.hw.add{background:transparent;border:2px dashed var(--line)}
.x{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;background:var(--soft);color:var(--mute)}
.chip.hw .x{position:absolute;top:5px;inset-inline-end:5px}
.chip.on .x{background:rgba(255,255,255,.25);color:inherit}
.more{border:0;background:none;color:var(--ink);font-weight:700;font-size:15px;text-decoration:underline;min-height:44px;padding:0 6px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow[hidden]{display:none}

.in{flex:1;font-weight:500;font-size:18px;min-height:56px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);width:100%}
.in:focus{outline:none;border-color:var(--ink);background:var(--card)}
.in::placeholder{color:var(--mute);opacity:.8}
.code{font-variant-numeric:tabular-nums;letter-spacing:.03em;font-size:20px;font-weight:600}
.field{display:flex;gap:8px}
.ib{flex:none;min-width:56px;min-height:56px;border-radius:14px;border:0;background:var(--ink);color:var(--card);display:inline-grid;place-items:center;font-weight:700;font-size:16px;padding:0 14px}
.ib svg{width:26px;height:26px}
.ib.ph-b{background:var(--yel);color:#17171C}
.ib.add{font-size:30px;font-weight:400;line-height:1;background:transparent;color:var(--ink);border:2px dashed var(--mute)}
.ib.busy,.btn.busy{opacity:.55;pointer-events:none}
.mrkbox{flex:1;display:flex;align-items:center;gap:1px;min-height:56px;padding:0 12px;border:2px solid var(--line);border-radius:14px;background:var(--soft);cursor:text}
.mrkbox:focus-within{border-color:var(--ink);background:var(--card)}
.mpre{font-size:17px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
#mrk{flex:1;width:100%;min-width:3.4em;border:0;background:transparent;color:var(--ink);font-size:26px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;padding:6px 4px 4px;border-bottom:4px solid var(--yel);border-radius:0;text-align:left}
#mrk:focus{outline:none;border-bottom-color:var(--red)}
#mrk::placeholder{color:var(--line);letter-spacing:.12em}
@media(max-width:440px){.field{gap:6px}.field .ib{min-width:48px;padding:0 10px}.mrkbox{padding:0 9px}.mpre{font-size:13.5px}#mrk{font-size:22px;letter-spacing:.03em}}
@media(max-width:390px){.sec{padding:14px 12px 16px}.field .ib{min-width:44px;padding:0 8px}.field .ib svg{width:22px;height:22px}.mrkbox{padding:0 7px}.mpre{font-size:12.5px}#mrk{font-size:20px;letter-spacing:.02em;min-width:3.2em}}
.phs{display:flex;gap:8px;margin-top:10px}
.phs:empty{display:none}
.pf{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:13px;color:var(--mute);box-shadow:var(--shadow)}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf .x{position:absolute;top:5px;inset-inline-end:5px;width:30px;height:30px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:84px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;padding:8px 6px;display:grid;justify-items:center;gap:6px}
.seg button svg{width:30px;height:30px}
.seg .w-yes svg{color:var(--ok)}.seg .w-no svg{color:var(--red)}.seg .w-unk svg{color:var(--mute)}
.seg .on.w-yes{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .on.w-no{background:var(--red);border-color:var(--red);color:#fff}
.seg .on.w-unk{background:var(--ink);border-color:var(--ink);color:var(--card)}
.seg .on svg{color:inherit}
.warn{color:var(--redd);font-size:15px;font-weight:700;margin:8px 0 0}
.warn:empty{display:none}

.cbx{position:relative}
.sug{border:2px solid var(--ink);border-radius:14px;margin-top:8px;max-height:320px;overflow:auto;background:var(--card);box-shadow:var(--shadow)}
.sug[hidden]{display:none}
.sug button{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 16px;min-height:54px;font-size:17px;line-height:1.3;position:relative}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button.act{background:var(--yels)}
.sug b{font-weight:700;unicode-bidi:plaintext}
.sug small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.sug .cst{padding-inline-end:52px}
.sug .x{position:absolute;inset-inline-end:12px;top:50%;margin-top:-15px;width:30px;height:30px;font-size:17px}
.sug .none{padding:14px 16px;color:var(--mute);font-size:15px}
.msg{font-size:15px;margin-top:10px;border-radius:14px}
.msg:empty{display:none}
.msg.ok{background:var(--oks);color:var(--ok);font-weight:700;padding:10px 14px}
.msg.err{background:color-mix(in srgb,var(--red) 10%,var(--card));border:2px solid var(--red);padding:12px 14px;color:var(--ink)}
.msg.err b{color:var(--redd)}
.msg.info{background:var(--yels);padding:10px 14px}
.msg .acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.submitbar{position:sticky;bottom:12px;z-index:5;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(20,20,30,.18);display:grid;gap:10px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);font-weight:500}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.primary{width:100%;min-height:62px;background:var(--red);color:#fff;border:0;border-radius:16px;font-weight:800;font-size:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--red) 35%,transparent)}
.primary:active{transform:translateY(1px)}
.primary.locked{background:var(--soft);color:var(--mute);box-shadow:none;border:2px dashed var(--line)}
.sec.need{border-color:var(--red);animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.sec.need{animation:none}}
.primary.confirm{background:var(--ink);color:var(--card);box-shadow:none}
.primary:disabled{opacity:.5}
.under{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--mute);margin:0}
.link{border:0;background:none;color:var(--ink);font-weight:700;font-size:15px;text-decoration:underline;min-height:44px;padding:0 4px}
.editing{background:var(--yel);color:#17171C;border-radius:16px;padding:10px 16px;margin-bottom:14px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.editing[hidden]{display:none}
.editing .link{color:#17171C}

/* ---------- list ---------- */
.list{background:var(--card);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow)}
.lhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.lhead h2{margin:0;font-size:24px;font-weight:800}
.lcount{font-size:15px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{border:2px solid transparent;background:var(--soft);color:var(--ink);text-align:start;padding:10px 12px;border-radius:14px;display:grid;gap:2px}
.stat b{font-size:clamp(24px,4vw,30px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat[data-f=yes] b{color:var(--ok)}.stat[data-f=no] b{color:var(--red)}
.stat[aria-pressed=true]{border-color:var(--ink);background:var(--card)}
.tools{display:grid;gap:10px;margin-bottom:14px}
.searchbox{position:relative}
.searchbox .sico{position:absolute;inset-inline-start:14px;top:50%;width:22px;height:22px;margin-top:-11px;color:var(--mute)}
.searchbox .in{padding-inline-start:46px;min-height:52px;font-size:17px}
.tbtns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.dark{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px;border-radius:16px;background:var(--soft);align-items:start}
.num{width:52px;height:52px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:700}
.t svg{width:24px;height:24px;color:var(--red);flex:none}
.mf{font-size:13px;font-weight:700;padding:2px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.md{font-weight:800;unicode-bidi:plaintext}
.dup{color:#fff;background:var(--red);font-size:12px;padding:2px 8px;border-radius:6px}
dl{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-size:15px}
dl div{display:flex;flex-wrap:wrap;gap:0 6px;min-width:0;max-width:100%}
dt{color:var(--mute);flex:none}
dd{margin:0;font-weight:600;unicode-bidi:plaintext;overflow-wrap:anywhere}
.side{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.war{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap}
.war.w-yes{background:var(--oks);color:var(--ok)}
.war.w-no{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--redd)}
.war.w-unk,.war.w-none{background:var(--card);color:var(--mute)}
.acts{display:flex;gap:6px}
.acts button{height:44px;border:0;background:var(--card);color:var(--ink);border-radius:12px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:600;font-size:14px}
.acts button:hover{background:var(--yels)}
.acts svg{width:19px;height:19px}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tb{border:0;border-radius:12px;background:var(--card);padding:0;width:72px;height:72px;overflow:hidden;position:relative;color:var(--mute);font-size:11px;box-shadow:var(--shadow)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb span{position:absolute;inset-inline:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;line-height:1.7}
.row.new{animation:pop .9s ease-out}
@keyframes pop{0%{background:var(--yels);transform:scale(.98)}100%{background:var(--soft);transform:none}}
@media(prefers-reduced-motion:reduce){.row.new{animation:none}*{transition:none!important}}
.empty span{max-width:30ch}
.empty b{color:var(--ink);font-size:19px}
.empty{padding:34px 12px;color:var(--mute);text-align:center;font-size:17px;display:grid;justify-items:center;gap:10px;background:transparent}
.empty svg{width:110px;height:auto}
.status{font-size:14px;color:var(--mute);margin:14px 0 0}
.mval{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.mval span{color:var(--mute);font-weight:500}
.mval b{font-size:17px;font-weight:800;color:var(--ink);background:var(--yels);padding:0 4px;border-radius:4px}

/* ---------- phones: one view at a time + bottom tabs ---------- */
.tabs{display:none}
@media(max-width:899px){
 body{padding-bottom:84px}
 .tabs{display:grid;grid-template-columns:1fr 1fr;position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -6px 24px rgba(20,20,30,.12);padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}
 .tabs button{min-height:56px;border:0;border-radius:14px;background:transparent;color:var(--mute);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
 .tabs [data-ico]{width:24px;height:24px}
 .tabs button[aria-current=page]{background:var(--yels);color:var(--ink)}
 .tabs b{background:var(--red);color:#fff;font-size:13px;min-width:24px;height:24px;border-radius:99px;display:inline-grid;place-items:center;padding:0 7px}
 .tabs b.bump{animation:bump .5s}
 body.typing .tabs{display:none}
 body.typing{padding-bottom:0}
 body.typing .submitbar{position:static;box-shadow:var(--shadow)}
 body.view-add .list{display:none}
 body.view-list .form{display:none}
 .submitbar{bottom:94px}
 .wrap{padding-top:16px}
}
@keyframes bump{50%{transform:scale(1.35)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top{border-radius:0 0 22px 22px;padding:14px 14px 16px}h1{font-size:27px}.kick{display:none}.sitecard{margin-top:12px}.who{margin-top:10px}.hbar{margin-top:12px;flex-wrap:nowrap}.ws button{padding:0 14px}#mobile .lbl{display:none}#mobile{min-width:48px;padding:0 12px}.datecard b{font-size:28px}.datecard{padding:6px 10px}.logo{width:44px;height:44px}.logo svg{width:34px;height:34px}.kick{font-size:14px}.tbtns .btn{flex:1 1 auto}}
@media(max-width:380px){.sitecard{grid-template-columns:1fr}.datecard span{display:none}}

/* ---------- toast & sheets ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s;background:var(--ink);color:var(--card);padding:12px 14px 12px 20px;border-radius:16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:16px;max-width:calc(100vw - 24px);z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(max-width:899px){#toast{bottom:auto;top:12px;transform:translate(-50%,-30px)}}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast button{border:0;background:var(--yel);color:#17171C;font-weight:800;border-radius:10px;min-height:42px;padding:0 16px}
#toast button[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(10,10,15,.5);display:grid;place-items:center;padding:16px;z-index:50}
.sheet[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:22px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.card h3{margin:0 0 8px;font-size:23px;font-weight:800}
.card p{margin:0 0 16px;color:var(--mute)}
.card .opts{display:grid;gap:10px;margin-bottom:14px}
.card .opts button{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;font-size:17px;text-align:start;padding:12px 16px;line-height:1.3;overflow-wrap:anywhere}
.card .opts button small{display:block;font-weight:400;font-size:14px;color:var(--mute);margin-top:3px}
.card .opts button:disabled{opacity:.45}
.card .opts .danger{border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.card .row2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.card .big{width:100%;border-radius:14px;display:block;background:var(--soft)}
.frm{display:grid;gap:12px;margin-bottom:14px}
.frm label{display:grid;gap:5px;font-size:15px;font-weight:700}
.frm select,.frm input{font-weight:500;font-size:17px;min-height:52px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);width:100%}
.frm .err{color:var(--redd);font-size:15px;font-weight:700;margin:0}
.frm .err:empty{display:none}
.qr{background:#fff;padding:12px;border-radius:16px;width:max-content;margin:0 auto 12px}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.lnk{font-size:13px;direction:ltr;text-align:center;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:8px;margin:0 0 12px;user-select:all}
.steps{margin:0 0 14px;padding-inline-start:20px;font-size:16px;display:grid;gap:6px}
.note{font-size:14px;color:var(--mute);margin:0 0 14px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body class="view-add">
<header class="top">
  <div class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="7" y="16" width="34" height="25" rx="4" fill="#fff"/><path d="M7 20h34" stroke="#E4002B" stroke-width="3"/><rect x="4" y="9" width="40" height="10" rx="3" fill="#FFC93C"/><path d="M19 29l4 4 7-8" fill="none" stroke="#E4002B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div><h1>רשימת גריטה</h1><p class="kick">איסוף ציוד לגריטה, פשוט ומהיר</p></div>
    </div>
    <div class="datecard" aria-label="תאריך היום"><b id="dDay"></b><span><em id="dWk"></em><i id="dMo"></i></span></div>
  </div>
  <div class="who" id="who" hidden><img id="whoImg" alt=""><div><b id="whoName"></b><span id="whoMail"></span></div></div>
  <div class="sitecard">
    <label class="pill"><span>שם האתר</span><input id="site" maxlength="80" autocomplete="off" placeholder="לדוגמה: מחסן מרכזי"></label>
    <label class="pill"><span>עיר</span><input id="city" maxlength="60" autocomplete="off" placeholder="לדוגמה: חיפה"></label>
  </div>
  <div class="hbar">
    <div class="ws" id="wsBar" role="radiogroup" aria-label="איזו רשימה להציג" hidden><button type="button" role="radio" data-ws="mine">הרשימה שלי</button><button type="button" role="radio" data-ws="team">רשימת צוות</button></div>
    <div class="acctbtns">
      <button class="btn ghost sm" type="button" id="teamAdmin" hidden>ניהול צוות</button>
      <button class="btn ghost sm" type="button" id="signOut" hidden>התנתקות</button>
      <button class="btn ghost sm" type="button" id="mobile"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="form" id="formView" aria-label="הוספת פריט">
    <div class="editing" id="editBar" hidden><span id="editTxt"></span><button class="link" id="editCancel" type="button">ביטול</button></div>

    <div class="sec step" data-step="type">
      <div class="sh"><span class="si" data-ico="box"></span><h2>מה הפריט? <small>בחר סוג חומרה</small></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="hwgrid" id="hw"></div>
      <div class="addrow" id="hwAdd" hidden><input class="in" id="hwNew" maxlength="40" placeholder="סוג חומרה חדש" autocomplete="off"><button class="ib" type="button" id="hwSave">הוסף</button></div>
    </div>

    <div class="sec step" data-step="mfr">
      <div class="sh"><span class="si" data-ico="tag"></span><h2>מי היצרן? <small id="mfHint"></small></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="chips" id="mf"></div>
      <div class="addrow" id="mfAdd" hidden><input class="in" id="mfNew" maxlength="40" placeholder="שם היצרן" autocomplete="off"><button class="ib" type="button" id="mfSave">הוסף</button></div>
    </div>

    <div class="sec step" data-step="model">
      <div class="sh"><span class="si" data-ico="search"></span><h2><label for="model">איזה דגם?</label> <small>הבחירה משלימה את השאר</small></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="field cbx"><input class="in" id="model" maxlength="60" dir="auto" autocomplete="off" spellcheck="false" enterkeyhint="next" placeholder="הקלד או בחר, למשל B1940" role="combobox" aria-expanded="false" aria-controls="modelSug" aria-autocomplete="list"><button class="ib add" type="button" id="modelPlus" aria-label="הוספת דגם חדש" title="דגם חדש">+</button></div>
      <div class="sug" id="modelSug" role="listbox" hidden></div>
      <div class="msg" id="modelMsg" aria-live="polite"></div>
    </div>

    <div class="sec step" data-step="sup">
      <div class="sh"><span class="si" data-ico="truck"></span><h2><label for="sup">מי הספק?</label></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="field cbx"><input class="in" id="sup" maxlength="60" dir="auto" autocomplete="off" enterkeyhint="next" placeholder="בחר ספק, למשל הראל מחשבים" role="combobox" aria-expanded="false" aria-controls="supSug" aria-autocomplete="list"><button class="ib add" type="button" id="supPlus" aria-label="הוספת ספק חדש" title="ספק חדש">+</button></div>
      <div class="sug" id="supSug" role="listbox" hidden></div>
    </div>

    <div class="sec step" data-step="serial">
      <div class="sh"><span class="si" data-ico="barcode"></span><h2><label for="serial">מספר סיריאלי</label> <small>סרוק, צלם או הקלד</small></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="field"><input class="in code" id="serial" maxlength="64" dir="auto" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" placeholder="מספר סיריאלי"><button class="ib" type="button" data-scan="serial" aria-label="סריקת ברקוד סיריאלי" title="סריקת ברקוד"></button><button class="ib ph-b" type="button" data-pic="ps" aria-label="הוספת תמונה של הסיריאלי" title="הוספת תמונה"></button></div>
      <div class="phs" id="box-ps"></div>
      <p class="warn" id="dupWarn"></p>
    </div>

    <div class="sec step" data-step="mrk">
      <div class="sh"><span class="si" data-ico="hash"></span><h2><label for="mrk">מספר מרכבה</label> <small>5 ספרות אחרונות</small></h2><span class="okc" aria-hidden="true"></span></div>
      <div class="field mfield"><div class="mrkbox" dir="ltr"><span class="mpre" aria-hidden="true">0610-00000000</span><input id="mrk" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" enterkeyhint="next" placeholder="_____" aria-label="מרכבה: 5 הספרות האחרונות"></div><button class="ib" type="button" data-scan="mrk" aria-label="סריקת ברקוד מרכבה" title="סריקת ברקוד"></button><button class="ib ph-b" type="button" data-pic="pm" aria-label="הוספת תמונה של המרכבה" title="הוספת תמונה"></button></div>
      <div class="phs" id="box-pm"></div>
    </div>

    <div class="sec step" data-step="war">
      <div class="sh"><span class="si" data-ico="shield"></span><h2>יש אחריות?</h2><span class="okc" aria-hidden="true"></span></div>
      <div class="seg" id="war" role="radiogroup" aria-label="אחריות"></div>
    </div>

    <div class="sec step" data-step="loc">
      <div class="sh"><span class="si" data-ico="pin"></span><h2><label for="loc">איפה הציוד נמצא?</label></h2><span class="okc" aria-hidden="true"></span></div>
      <input class="in" id="loc" maxlength="120" list="locs" autocomplete="off" enterkeyhint="done" placeholder="לדוגמה: מחסן קומה 2, חדר 14">
      <datalist id="locs"></datalist>
    </div>

    <div class="submitbar">
      <div class="prog"><span class="pbar"><i id="pfill"></i></span><span id="prog"></span></div>
      <button class="primary" type="button" id="submit">הוסף לרשימה</button>
    </div>
    <div class="under">
      <p class="hint">סוג, יצרן, דגם, ספק, אחריות ומיקום נשארים לפריט הבא.</p>
      <button class="link" type="button" id="reset">נקה טופס</button>
    </div>
  </section>

  <section class="list" id="listView" aria-label="הפריטים ברשימה">
    <div class="lhead"><h2>הרשימה</h2><span class="lcount" id="lcount"></span></div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <label class="vh" for="q">חיפוש</label>
      <div class="searchbox"><span class="sico" data-ico="search" aria-hidden="true"></span><input class="in" id="q" type="search" maxlength="64" placeholder="חיפוש דגם, סיריאלי, מרכבה, ספק…" autocomplete="off"></div>
      <div class="tbtns">
        <button class="btn dark" type="button" id="xlsx"></button>
        <button class="btn" type="button" id="copy">העתק טבלה</button>
        <button class="btn" type="button" id="clear">נקה נתונים</button>
      </div>
    </div>
    <ul class="rows" id="rows"></ul>
    <p class="status" id="status">מתחבר…</p>
  </section>
</main>

<nav class="tabs" aria-label="ניווט">
  <button type="button" data-tab="add" aria-current="page"><span data-ico="plus"></span>הוספה</button>
  <button type="button" data-tab="list"><span data-ico="list"></span>הרשימה<b id="tabCount">0</b></button>
</nav>

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function rotate(c){const r=document.createElement('canvas');r.width=c.height;r.height=c.width;const g=r.getContext('2d');g.translate(r.width/2,r.height/2);g.rotate(Math.PI/2);g.drawImage(c,-c.width/2,-c.height/2);return r}
async function decode(file){
 const c=await shrink(file,1800);
 if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(c);const v=[...new Set(r.map(x=>x.rawValue).filter(Boolean))];if(v.length)return v}catch(e){}}
 if(!window.ZXing)await loadScript(ZX_SRC);
 const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);const rd=new Z.MultiFormatReader();rd.setHints(hints);
 for(const cv of [c,rotate(c)]){try{const bm=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));return [rd.decodeWithState(bm).getText()]}catch(e){}}
 return [];

 $('#cpLink').onclick=async()=>{try{await navigator.clipboard.writeText(APP_URL);toast('הקישור הועתק')}catch(e){toast('סמן את הקישור והעתק ידנית')}};
 try{if(!window.QRCode)await loadScript(QR_SRC);const el=$('#qr');if(el){el.innerHTML='';new window.QRCode(el,{text:APP_URL,width:200,height:200,colorDark:'#111111',colorLight:'#ffffff',correctLevel:window.QRCode.CorrectLevel.M})}}
 catch(e){const el=$('#qr');if(el)el.remove()}
};

/* ---------- start ---------- */
async function start(){
 renderChips();render();
 if(!(window.claude&&window.claude.use)){mode='local';lsLoad();syncHeader();renderChips();render();setStatus('local');return}
 const [d,dn,as,us]=await Promise.all(['db','downloads','assets','user'].map(n=>window.claude.use(n).catch(()=>null)));
 dl=dn;assets=as;userCap=us;
 if(us){try{const me=await us.me();uidMe=typeof me.id==='string'&&SAFE_ID.test(me.id)&&!/^\.+$/.test(me.id)?me.id:null;canWrite=await us.can('data.write');showMe(me)}catch(e){}}
 if(!d){mode='local';lsLoad();syncHeader();renderChips();render();setStatus('local');return}
 db=d;
 // outside Claude every signed-in person may always write their own list; canWrite only means team membership
 try{const p=localStorage.getItem('scrap-ws');if(p==='team'||p==='mine')ws=p}catch(e){}
 if(canWrite===true)$('#wsBar').hidden=false;else ws='mine';
 if(us&&await us.isOwner())$('#teamAdmin').hidden=false;
 $('#signOut').hidden=false;
 connect();
}
function showMe(me){
 const el=$('#who');if(!el)return;
 const nm=me.name||'',em=me.email||'';
 if(!nm&&!em){el.hidden=true;return}
 el.hidden=false;$('#whoImg').src=me.avatarUrl;$('#whoName').textContent=nm?`שלום, ${nm}`:'מחובר';$('#whoMail').textContent=em;
}
function renderWs(){document.querySelectorAll('[data-ws]').forEach(b=>{const on=b.dataset.ws===ws;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)})}
function connect(){
 if(metaTimer){clearTimeout(metaTimer);metaTimer=null;if(pendingMeta)pendingMeta()}metaDirty=false;
 unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];clearTimeout(loadTimer);
 items=[];meta={site:'',city:'',mf:[],hw:[],sup:[],cat:[]};editId=null;$('#editBar').hidden=true;
 readonly=ws==='team'&&canWrite===false;applyRO();renderWs();
 if(ws==='mine'&&(!uidMe||personalRefused)){mode='local';lsLoad();syncHeader(true);renderChips();render();setStatus('local');return}
 mode='db';syncHeader(true);renderChips();
 const wasMode=mode;mode='wait';render();mode=wasMode;setStatus('wait');
 loadTimer=setTimeout(()=>setStatus('slow'),10000);
 unsubs.push(db.collection(BASE()+'/items').onSnapshot(s=>{
  if(!s.metadata.fromCache){clearTimeout(loadTimer);setStatus('db')}
  items=s.docs.map(x=>cleanItem(x.data(),x.id,'ad'));
  render();checkDup();
 },()=>{clearTimeout(loadTimer);setStatus('err');render()}));
 unsubs.push(db.doc(BASE()).onSnapshot(s=>{
  if(metaDirty)return;
  meta=cleanMeta(s.exists?s.data():{});
  syncHeader();renderChips();
 },()=>{}));
}
document.querySelectorAll('[data-ws]').forEach(b=>b.addEventListener('click',()=>{
 if(b.dataset.ws===ws)return;clearForm();ws=b.dataset.ws;try{localStorage.setItem('scrap-ws',ws)}catch(e){}connect();
 toast(ws==='team'?'עברת לרשימת הצוות':'עברת לרשימה האישית שלך');
}));
start();
}
</script>
</body>
